name: Deploy to GitHub Pages

# Testet die Engine gegen den Referenz-Korpus (100 % Pflicht), baut dist/index.html
# aus Template + vendor und deployt sie bei jedem Push auf main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig; laufende abbrechen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Test-Gate: validate.js muss 100 % grün sein (Exit != 0 bei FAIL/MISS),
  # sonst wird nicht deployt. Verhindert, dass eine kaputte Engine live geht.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # package-lock.json ist bewusst nicht committet (einzige Dev-Dependency:
      # pdfjs-dist fürs Test-Harness) -> npm install statt npm ci, kein Cache
      - run: npm install
      - name: Engine gegen Referenz-Korpus validieren
        run: node test/validate.js test/samples

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build dist/index.html
        run: python3 build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
