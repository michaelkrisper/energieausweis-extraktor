name: Deploy to GitHub Pages

# Deploys dist/ to GitHub Pages, only after CI is green:
# - after a successful CI run for a push to main (workflow_run), or
# - on manual / dependabot-auto-merge dispatch, which runs CI first (workflow_call).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && needs.ci.result == 'success') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push')
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Build dist/index.html
        run: python3 build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
